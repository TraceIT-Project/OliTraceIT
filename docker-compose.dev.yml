version: '3.8'

# Docker Compose para desarrollo
# Inspirado en Open-WebUI pero desarrollado desde cero

services:
  # Base de datos vectorial Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mcp-saas-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data_dev:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # Backend FastAPI (modo desarrollo con hot-reload)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mcp-saas-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - backend_data_dev:/app/data
    environment:
      - ENV=development
      - PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=postgresql://mcp_user:mcp_password@postgres:5432/mcp_saas
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
    command: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - qdrant
    restart: unless-stopped

  # Frontend React (modo desarrollo)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: mcp-saas-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data_dev:
  backend_data_dev:

networks:
  default:
    name: mcp-saas-network-dev

